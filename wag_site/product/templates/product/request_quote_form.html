<div class="form-popup-bg" id="formPopup">
    
    <div class="form-container">
      <button id="btnCloseForm" class="close-button">&times;</button>
      
      <!-- العنوان الرئيسي -->
      <h5 class="section-title mb-2">Request a Quotation</h5>
      <p> included Contact our consultants to receive a personalised estimate and transform your ideas into projects.</p>

      <!-- بطاقة تفاصيل المنتج -->
      <div class="product-card">
        <img src="https://images.pexels.com/photos/27054224/pexels-photo-27054224/free-photo-of-motorbike-parked-on-hill-on-sea-coast.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Product Image">
        <div>
          <h6>Product Name</h6>
          <p class="text-muted">Product Subtitle</p>
        </div>
      </div>

      <!-- البيانات الشخصية -->
      {% comment %} <h6 class="section-title mt-3">Your Data</h6> {% endcomment %}
      <form>
        <div class="form-group">
 
			<div class="form-row">
				<div class="form-group">
				  <label for="firstName">First Name</label>
				  <input type="text" id="firstName" class="form-control" placeholder="Enter your first name">
				</div>
				<div class="form-group">
				  <label for="lastName">Last Name</label>
				  <input type="text" id="lastName" class="form-control" placeholder="Enter your last name">
				</div>
			  </div>


			  <div class="form-row">
				<div class="form-group">
					<label for="email">Email</label>
					<input type="email" id="email" class="form-control" placeholder="Enter your email">
				 </div>
				<div class="form-group">
					<label for="phone">Phone Number</label>
					<input type="tel" id="phone" class="form-control" placeholder="Enter your phone number">
				 </div>
			  </div>


        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" class="form-control" rows="3" placeholder="Your message..."></textarea>
        </div>
        
        <!-- سياسة الخصوصية -->
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="policy">
          <label class="form-check-label" for="policy">I agree to the privacy policy</label>
        </div>

        <!-- زر الإرسال -->
	    <button type="submit" class="btn btn-primary btn-block submit-btn">Submit Request</button>
      </form>
    </div>
  </div>

 

<script>
document.getElementById("btnOpenForm").addEventListener("click", function(event) {
    event.preventDefault();
    document.getElementById("formPopup").classList.add("is-visible");
});

document.getElementById("btnCloseForm").addEventListener("click", function() {
    document.getElementById("formPopup").classList.remove("is-visible");
});
</script>
